services:
  catalogue:
    build: ./catalogue
    image: charandasa/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb
  user:
    build: ./user
    image: charandasa/user:1.0.0
    container_name: user
    depends_on:
    - mongodb
    - redis
  cart:
    build: ./cart
    image: charandasa/cart:1.0.0
    container_name: cart
    depends_on:
    - redis
  shipping:
    build: ./shipping
    image: charandasa/shipping:1.0.0
    container_name: shipping
    depends_on:
    - mysql
  payment:
    build: ./payment
    image: charandasa/payment:1.0.0
    container_name: payment
    ENV: CART_HOST=cart
    ENV: CART_PORT=8080
    ENV: USER_HOST=user
    ENV: USER_PORT=8080
    ENV: AMQP_HOST=rabbitmq
    ENV: AMQP_USER=roboshop
    ENV: AMQP_PASS=roboshop123
    depends_on:
    - rabbitmq
    - cart
    - user
  frontend:
    build: ./frontend
    image: charandasa/frontend:1.0.0
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping

  redis:
    image: redis:7.0
    container_name: redis
  mysql:
    build: ./mysql
    image: charandasa/mysql:1.0.0
    container_name: mysql
  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBIT_MQ_DEFAULT_USER: roboshop
      RABBIT_MQ_DEFAULT_PASS: roboshop123
    container_name: rabbitmq

  mongodb:
    build: ./mongodb
    image: charandasa/mongodb:1.0.0
    container_name: mongodb

networks:
  default: 
    driver: bridge
    name: roboshop
    external: false